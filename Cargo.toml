[package]
name = "restart-motd"
version = "1.0.0"
license = "GPL-3.0"
description = "Shows a 'server is restarting' MOTD while the Minecraft server is down."
edition = "2021"

[profile.release]
lto = true
strip = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util", "time"] }
toml = "0.8"
